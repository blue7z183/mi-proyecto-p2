<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Captura de Datos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bosque: #1d3b2a;
      --helecho: #2f6b45;
      --musgo: #4f8a5b;
      --salvia: #a8c9ae;
      --menta: #e3f0e4;
      --bruma: #f3f8f2;
      --papel: #ffffff;
      --texto: #1b2b21;
      --texto-suave: #567061;
      --borde: #c9ddcc;
      --error: #8a3b2f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 16px 56px;
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--texto);
      background:
        radial-gradient(900px 420px at 15% -10%, var(--salvia) 0%, transparent 60%),
        radial-gradient(700px 380px at 100% 0%, #cfe5d2 0%, transparent 55%),
        var(--bruma);
      background-attachment: fixed;
    }

    .tarjeta {
      max-width: 760px;
      margin: 0 auto;
      background: var(--papel);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(29, 59, 42, 0.14), 0 2px 6px rgba(29, 59, 42, 0.06);
    }

    .cabecera {
      padding: 36px 40px 30px;
      background: linear-gradient(135deg, var(--bosque) 0%, var(--helecho) 100%);
      color: #f1f8f1;
    }

    h2 {
      margin: 0 0 6px;
      font-family: "Fraunces", Georgia, "Times New Roman", serif;
      font-weight: 600;
      font-size: clamp(1.7rem, 4vw, 2.2rem);
      letter-spacing: -0.01em;
    }

    .cabecera p {
      margin: 0;
      color: #cfe5d2;
      font-size: 0.97rem;
    }

    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px 24px;
      padding: 36px 40px 40px;
    }

    .campo { display: flex; flex-direction: column; }
    .campo.ancho { grid-column: 1 / -1; }

    label {
      margin-bottom: 7px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--bosque);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      font: inherit;
      color: var(--texto);
      background: var(--bruma);
      border: 1.5px solid var(--borde);
      border-radius: 10px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    input:hover { border-color: var(--salvia); }

    input:focus {
      outline: none;
      background: var(--papel);
      border-color: var(--musgo);
      box-shadow: 0 0 0 4px rgba(79, 138, 91, 0.2);
    }

    input:user-invalid { border-color: var(--error); }

    button {
      grid-column: 1 / -1;
      margin-top: 6px;
      padding: 14px 20px;
      font: inherit;
      font-weight: 600;
      font-size: 1.02rem;
      color: #fff;
      background: linear-gradient(135deg, var(--helecho), var(--bosque));
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(47, 107, 69, 0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.08);
      box-shadow: 0 12px 22px rgba(47, 107, 69, 0.34);
    }

    button:active:not(:disabled) { transform: translateY(0); }

    button:focus-visible {
      outline: 3px solid var(--salvia);
      outline-offset: 3px;
    }

    button:disabled {
      cursor: progress;
      opacity: 0.7;
      box-shadow: none;
    }

    #estado {
      max-width: 760px;
      margin: 18px auto 0;
      min-height: 1.4em;
      text-align: center;
      font-weight: 600;
      color: var(--helecho);
    }

    #estado:not(:empty) {
      padding: 12px 18px;
      background: var(--menta);
      border: 1px solid var(--salvia);
      border-radius: 12px;
    }

    @media (max-width: 620px) {
      body { padding: 20px 12px 40px; }
      .cabecera { padding: 28px 24px 24px; }
      form { grid-template-columns: 1fr; padding: 26px 24px 30px; gap: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <div class="tarjeta">
    <div class="cabecera">
      <h2>Captura de Datos</h2>
      <p>Completa todos los campos para registrar tu solicitud.</p>
    </div>

  <form id="formulario" action="https://script.google.com/macros/s/AKfycbzBRN376M6yMyWzsfonyLWt6gVuZV0ZTUpf-SvtFNR4Miclrr2DS3Ce4cIpTbhPl-Er/exec" method="POST" target="hidden_iframe" onsubmit="enviado()">

    <div class="campo ancho">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>
    </div>

    <div class="campo">
      <label for="edad">Edad:</label>
      <input type="number" id="edad" name="edad" required min="1" max="120">
    </div>

    <div class="campo">
      <label for="genero">Género:</label>
      <input type="text" id="genero" name="genero" required>
    </div>

    <div class="campo">
      <label for="estudios">Estudios:</label>
      <input type="text" id="estudios" name="estudios" required>
    </div>

    <div class="campo">
      <label for="curp">CURP:</label>
      <input type="text" id="curp" name="curp" required>
    </div>

    <div class="campo">
      <label for="institucion">Institución:</label>
      <input type="text" id="institucion" name="institucion" required>
    </div>

    <div class="campo">
      <label for="puesto">Puesto que aplica:</label>
      <input type="text" id="puesto" name="puesto" required>
    </div>

    <div class="campo ancho">
      <label for="dinero">Dinero que desea ganar mensualmente:</label>
      <input type="number" id="dinero" name="dinero" required min="0" max="100000">
    </div>

    <div class="campo">
      <label for="tiempo">Tiempo disponible para trabajar:</label>
      <input type="text" id="tiempo" name="tiempo" required>
    </div>

    <div class="campo">
      <label for="estadia">Estadía que desea en la compañia:</label>
      <input type="text" id="estadia" name="estadia" required>
    </div>

    <button type="submit" id="btnEnviar">Enviar</button>
  </form>
  </div>

  <p id="estado"></p>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <script>
    function enviado() {
      document.getElementById('btnEnviar').disabled = true;
      document.getElementById('estado').textContent = 'Guardando...';
      
      setTimeout(function() {
        document.getElementById('estado').textContent = '¡Registro guardado con éxito!';
        document.getElementById('formulario').reset();
        document.getElementById('btnEnviar').disabled = false;
      }, 1500);
    }
  </script>

</body>
</html>
